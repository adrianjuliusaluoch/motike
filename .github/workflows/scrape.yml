name: scrape

on:
  schedule:
    - cron: "0 21 * * *"       # 21:00 UTC = 00:00 Nairobi (GitHub may start it a few minutes late)
  workflow_dispatch:           # manual "Run workflow" button
    inputs:
      max_pages:
        description: "Limit listing pages for a test run (leave empty for all)"
        required: false
        default: ""

permissions:
  contents: write              # lets the job commit data/ back

concurrency:
  group: scrape
  cancel-in-progress: false    # never run two at once

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Check files
        run: |
          ls -la
          for f in scraper.py titles.py requirements.txt; do
            test -f "$f" || { echo "::error::$f is missing from the repo root"; exit 1; }
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape
        timeout-minutes: 320   # leaves time for the commit step below
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
        run: python scraper.py

      - name: Commit data
        if: always()           # also saves the checkpoint if the scrape crashed or timed out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "data: $(date -u +%F)"
          git pull --rebase
          git push
